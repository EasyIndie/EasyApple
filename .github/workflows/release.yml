name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: "已存在的 tag(用于 dry-run 验证)"
        required: true
      dry_run:
        description: "只构建/签名/打包,不创建 GitHub Release"
        type: boolean
        default: true

# 同一 tag 只跑一次发布
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# 建 Release 需要写权限
permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      apps: ${{ steps.meta.outputs.apps }}
      dry_run: ${{ steps.meta.outputs.dry_run }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref_name }}
          fetch-depth: 0

      - name: 校验 tag 与列出应用
        id: meta
        env:
          REF: ${{ inputs.tag || github.ref_name }}
          DRY_RUN: ${{ inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          v="$(sed -n 's/^version=//p' version.properties | head -1 | tr -d '[:space:]')"
          [ -n "$v" ] || { echo "::error::version.properties 缺少 version"; exit 1; }
          echo "tag=$REF version=$v dry_run=$DRY_RUN"
          [ "$REF" = "$v" ] || { echo "::error::tag 与 version.properties 不一致"; exit 1; }
          apps="$(find apps -mindepth 1 -maxdepth 1 -type d -exec basename {} \; \
            | LC_ALL=C sort \
            | python3 -c 'import json,sys; print(json.dumps([l.strip() for l in sys.stdin if l.strip()]))')"
          [ "$apps" != "[]" ] || { echo "::error::apps/ 下没有应用"; exit 1; }
          {
            echo "tag=$REF"
            echo "apps=$apps"
            echo "dry_run=$DRY_RUN"
          } >> "$GITHUB_OUTPUT"

      - name: 输出应用列表
        run: echo "${{ steps.meta.outputs.apps }}"

  sign:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        app: ${{ fromJSON(needs.prepare.outputs.apps) }}
    uses: EasyIndie/EasyRelease/.github/workflows/apple-release.yml@apple-v0.6.3
    with:
      runs_on: xcode-27
      kit_ref: apple-v0.6.3
      checkout_ref: ${{ needs.prepare.outputs.tag }}
      app: ${{ matrix.app }}
      build_command: bash tools/bundle.sh --app ${{ matrix.app }} --platform macOS
      mode: developer-id
      notarize: true
      identity: ${{ vars.MACOS_SIGNING_IDENTITY }}
      release: false
      upload_artifact: true
    secrets: inherit

  publish:
    needs: [prepare, sign]
    runs-on: xcode-27
    permissions:
      contents: write
    steps:
      - name: 下载签名产物
        uses: actions/download-artifact@v4
        with:
          pattern: easyrelease-*
          path: dist

      - name: 打包
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          archives=()
          for dir in dist/easyrelease-*; do
            [ -d "$dir" ] || continue
            app="${dir#dist/easyrelease-}"
            [ -f "$dir/apple-manifest.json" ] || { echo "::error::缺少 $dir/apple-manifest.json"; exit 1; }

            files=()
            zips=("$dir"/*.zip)
            apps=("$dir"/*.app)
            dmgs=("$dir"/*.dmg)
            pkgs=("$dir"/*.pkg)

            if [ ${#zips[@]} -eq 1 ]; then
              # EasyRelease 已产出签名/公证后的 zip,直接作为发布物。
              cp "${zips[0]}" "$app-$TAG.zip"
              files=("$app-$TAG.zip")
            elif [ ${#apps[@]} -eq 1 ]; then
              archive="$app-$TAG.zip"
              stage="$RUNNER_TEMP/release-$app"
              rm -rf "$stage"
              mkdir -p "$stage"
              # ditto 保留 bundle 元数据/扩展属性,避免 staple 票据在打包时丢失。
              ditto "${apps[0]}" "$stage/$app.app"
              cp "$dir/apple-manifest.json" "$stage/apple-manifest.json"
              ditto -c -k "$stage" "$archive"
              files=("$archive")
            elif [ ${#dmgs[@]} -eq 1 ]; then
              cp "${dmgs[0]}" "$app-$TAG.dmg"
              files=("$app-$TAG.dmg")
            elif [ ${#pkgs[@]} -eq 1 ]; then
              cp "${pkgs[0]}" "$app-$TAG.pkg"
              files=("$app-$TAG.pkg")
            else
              echo "::error::$dir 里没有唯一的 .zip/.app/.dmg/.pkg"
              find "$dir" -maxdepth 2 -print
              exit 1
            fi

            cp "$dir/apple-manifest.json" "$app-$TAG-manifest.json"
            files+=("$app-$TAG-manifest.json")

            for f in "${files[@]}"; do
              shasum -a 256 "$f" > "$f.sha256"
              archives+=("$f" "$f.sha256")
            done
          done
          [ ${#archives[@]} -gt 0 ] || { echo "::error::没有可发布产物"; exit 1; }
          printf '%s\n' "${archives[@]}" > archives.txt
          cat archives.txt

      - name: 上传 dry-run 包
        if: needs.prepare.outputs.dry_run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: release-dry-run-${{ needs.prepare.outputs.tag }}
          path: |
            *.zip
            *.dmg
            *.pkg
            *.json
            *.sha256
            archives.txt
          if-no-files-found: error

      - name: 创建 GitHub Release
        if: needs.prepare.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -euo pipefail
          archives=()
          while IFS= read -r f; do
            [ -n "$f" ] && archives+=("$f")
          done < archives.txt
          [ ${#archives[@]} -gt 0 ] || { echo "::error::没有可发布文件"; exit 1; }
          gh release create "$TAG" "${archives[@]}" --verify-tag --generate-notes
