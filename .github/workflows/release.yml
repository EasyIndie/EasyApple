name: Release

on:
  push:
    tags:
      - '[0-9]*.[0-9]*.[0-9]*'

# 建 Release 需要写权限
permissions:
  contents: write

jobs:
  release:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 校验 tag == version.properties
        run: |
          tag="${GITHUB_REF_NAME}"
          v="$(bash tools/sync-version.sh | sed -n 's/^version=//p')"
          echo "tag=$tag version=$v"
          [ "$tag" = "$v" ] || { echo "tag 与 version.properties 不一致"; exit 1; }

      - name: 选择 Xcode 27(优先 27.0 稳定版)
        run: |
          shopt -s nullglob
          all=(/Applications/Xcode_27*.app /Applications/Xcode-27*.app)
          pick=""
          for p in "${all[@]}"; do
            case "$p" in *27.0*) pick="$p"; break;; esac
          done
          if [ -z "$pick" ] && [ ${#all[@]} -gt 0 ]; then
            pick="$(printf '%s\n' "${all[@]}" | sort -V | tail -1)"
          fi
          if [ -n "$pick" ]; then
            sudo xcode-select -s "$pick/Contents/Developer"
          fi
          xcodebuild -version

      - name: 打包(macOS,遍历所有应用)
        run: |
          source tools/_common.sh
          for app in $(list_apps); do
            echo "== $app =="
            bash tools/bundle.sh --app "$app" --platform macOS
          done

      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source tools/_common.sh
          archives=()
          for app in $(list_apps); do
            APP="apps/$app/.build/bundle/$app.app"
            [ -d "$APP" ] || { echo "缺少 $APP(打包步骤失败?)"; exit 1; }
            archive="$app-${GITHUB_REF_NAME}.tar.gz"
            stage="$(mktemp -d)"
            cp -R "$APP" "$stage/"
            items=("$app.app")
            # 仅当产物是 ad-hoc(未真实签名)时,附上绕过 Gatekeeper 的打开脚本;
            # 一旦将来用 Developer ID 签名并公证,就不再附带。
            if is_adhoc_signed "$APP"; then
              echo "$app: ad-hoc 签名 → 附带 open-unsigned-app.sh"
              install -m 0755 tools/open-unsigned-app.sh "$stage/"
              items+=(open-unsigned-app.sh)
            else
              echo "$app: 已真实签名 → 不附带绕过脚本"
            fi
            tar -czf "$archive" -C "$stage" "${items[@]}"
            archives+=("$archive")
          done
          [ "${#archives[@]}" -gt 0 ] || { echo "apps/ 下没有可发布的应用"; exit 1; }
          gh release create "${GITHUB_REF_NAME}" "${archives[@]}" --generate-notes
          # 后续签名 secrets 命名预留(本阶段零证书,不启用):
          #   APPLE_CERT_P12_BASE64 / APPLE_CERT_PASSWORD / APPLE_ID / APPLE_TEAM_ID
