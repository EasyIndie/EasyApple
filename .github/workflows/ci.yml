name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# macOS runner 是 10× 计费倍率;显式 pin(见决策 D9),不用 macos-latest。
jobs:
  build-test:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 提交信息规范(Conventional Commits)
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bad=0
          while IFS= read -r msg; do
            [ -n "$msg" ] || continue
            if ! printf '%s' "$msg" | grep -qE '^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\(.+\))?!?: '; then
              echo "不规范: $msg"; bad=1
            fi
          done < <(git log --format=%s "$base..$head")
          [ "$bad" -eq 0 ] || { echo "存在不符合 Conventional Commits 的提交"; exit 1; }

      - name: 选择 Xcode 27(优先 27.0 稳定版)
        run: |
          echo "可用 Xcode:"; ls -d /Applications/Xcode*.app || true
          shopt -s nullglob
          all=(/Applications/Xcode_27*.app /Applications/Xcode-27*.app)
          pick=""
          for p in "${all[@]}"; do
            case "$p" in *27.0*) pick="$p"; break;; esac
          done
          if [ -z "$pick" ] && [ ${#all[@]} -gt 0 ]; then
            pick="$(printf '%s\n' "${all[@]}" | sort -V | tail -1)"
          fi
          if [ -n "$pick" ]; then
            echo "选择: $pick"
            sudo xcode-select -s "$pick/Contents/Developer"
          else
            echo "未找到 Xcode 27,使用默认"
          fi
          xcodebuild -version

      - name: doctor
        run: bash tools/doctor.sh

      - name: 版本一致性
        run: bash tools/sync-version.sh --check

      - name: 构建
        run: bash tools/build.sh

      - name: 测试
        run: bash tools/test.sh

      - name: 模拟器冒烟 + 文本断言(遍历所有应用)
        continue-on-error: true
        run: |
          set -uo pipefail
          source tools/_common.sh
          mkdir -p .tmp
          for app in $(list_apps); do
            echo "::group::模拟器冒烟 $app"
            if ! bash tools/run-sim.sh --app "$app" --screenshot "$PWD/.tmp/ci-$app.png"; then
              echo "[skip] $app 启动失败(不阻塞 CI)"
              echo "::endgroup::"
              continue
            fi
            # runner 是 VM(无 GPU/ANE),accurate 会失败但 fast 可用;uiscan 自动降级。两种都不可用则跳过,不误报
            if bash tools/ui-scan.sh --input "$PWD/.tmp/ci-$app.png" >/dev/null 2>"$PWD/.tmp/uiscan-$app.log"; then
              if [ -f "apps/$app/ui-assertions.txt" ]; then
                bash tools/ui-assert.sh --input "$PWD/.tmp/ci-$app.png" --app "$app" \
                  || echo "文本断言失败(不阻塞 CI)"
              else
                echo "[skip] $app 无 apps/$app/ui-assertions.txt,跳过文本断言"
              fi
            else
              echo "[skip] 本 runner 上 Vision OCR 不可用,跳过文本断言(原因见 docs/08)"
              sed 's/^/    /' "$PWD/.tmp/uiscan-$app.log"
            fi
            echo "::endgroup::"
          done

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: .tmp/*.png
          if-no-files-found: ignore
