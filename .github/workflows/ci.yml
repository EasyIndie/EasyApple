name: CI

on:
  push:
    branches: [main]
    # 纯文档改动不跑 CI(macOS runner 是 10× 计费);改代码/脚本/工作流仍跑。
    # ⚠️ 若以后给 main 开了 required status checks,文档 PR 会因不产生检查而卡住。
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.agents/skills/**'
      - '.agents/skills-sources.lock.json'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - 'LICENSE'
      - '.agents/skills/**'
      - '.agents/skills-sources.lock.json'
  workflow_dispatch:

# macOS runner 是 10× 计费倍率;显式 pin(见决策 D9),不用 macos-latest。
jobs:
  build-test:
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 缓存构建产物(SwiftPM + iOS 模拟器 DerivedData)
        uses: actions/cache@v4
        with:
          path: |
            apps/*/.build
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/org.swift.swiftpm
          # 源码/依赖/脚本变了就换 key;restore-keys 保底复用上一次的增量结果
          key: ${{ runner.os }}-${{ runner.arch }}-xcode-${{ hashFiles('apps/**/Package.swift', 'apps/**/Package.resolved', 'apps/**/Sources/**/*.swift', 'apps/**/Tests/**/*.swift', 'tools/**/*.sh') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-xcode-

      - name: 提交信息规范(Conventional Commits)
        if: github.event_name == 'pull_request'
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          head="${{ github.event.pull_request.head.sha }}"
          bash tools/release.sh --check-commits "$base..$head"

      - name: 仓库自检(不需要 Xcode)
        run: bash tools/repo-check.sh

      - name: 选择 Xcode 27.2
        uses: ./.github/actions/select-xcode
        with:
          version: "27.2"

      - name: doctor
        run: bash tools/doctor.sh

      - name: 版本一致性
        run: bash tools/sync-version.sh --check

      - name: 模板冒烟(template/ 不参与常规构建,这里单独验)
        run: bash tools/test-template.sh

      - name: 构建
        run: bash tools/build.sh

      - name: 测试
        run: bash tools/test.sh

      - name: 测试(iOS 运行时,无需 .xcodeproj)
        run: bash tools/test-ios.sh

      - name: 模拟器冒烟 + 文本断言(遍历所有应用)
        continue-on-error: true
        run: |
          set -uo pipefail
          source tools/_common.sh
          mkdir -p .tmp
          for app in $(list_apps); do
            echo "::group::模拟器冒烟 $app"
            if ! bash tools/run-sim.sh --app "$app" --screenshot "$PWD/.tmp/ci-$app.png"; then
              echo "[skip] $app 启动失败(不阻塞 CI)"
              echo "::endgroup::"
              continue
            fi
            # runner 是 VM(无 GPU/ANE),accurate 会失败但 fast 可用;uiscan 自动降级。两种都不可用则跳过,不误报
            if bash tools/ui-scan.sh --input "$PWD/.tmp/ci-$app.png" >/dev/null 2>"$PWD/.tmp/uiscan-$app.log"; then
              if [ -f "apps/$app/ui-assertions.txt" ]; then
                bash tools/ui-assert.sh --input "$PWD/.tmp/ci-$app.png" --app "$app" \
                  || echo "文本断言失败(不阻塞 CI)"
              else
                echo "[skip] $app 无 apps/$app/ui-assertions.txt,跳过文本断言"
              fi
            else
              echo "[skip] 本 runner 上 Vision OCR 不可用,跳过文本断言(原因见 docs/08)"
              sed 's/^/    /' "$PWD/.tmp/uiscan-$app.log"
            fi
            echo "::endgroup::"
          done

      - name: 上传截图
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: simulator-screenshot
          path: .tmp/*.png
          if-no-files-found: ignore
          # .tmp 是隐藏目录,upload-artifact v4 默认跳过隐藏文件
          include-hidden-files: true

      - name: 上传 iOS 单测结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-test-result
          path: apps/*/.build/ios-test/result.xcresult
          if-no-files-found: ignore
          # .build 同样是隐藏目录
          include-hidden-files: true
